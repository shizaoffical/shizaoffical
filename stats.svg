<svg width="1200" height="94" viewBox="0 0 1200 94" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tintGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2A1B"/>
      <stop offset="100%" stop-color="#0D1F15"/>
    </linearGradient>
    <linearGradient id="tintBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122036"/>
      <stop offset="100%" stop-color="#0F1A2B"/>
    </linearGradient>
    <linearGradient id="tintPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#211430"/>
      <stop offset="100%" stop-color="#191029"/>
    </linearGradient>
  </defs>

  <!-- ===== pill 1: 4+ years ===== -->
  <g transform="translate(30,10)">
    <rect width="366" height="74" rx="37" fill="url(#tintGreen)" stroke="#238636" stroke-width="1.5"/>
    <circle cx="38" cy="37" r="21" fill="#39D353"/>
    <circle cx="38" cy="37" r="12" fill="none" stroke="#0D1117" stroke-width="2"/>
    <line x1="38" y1="37" x2="38" y2="29" stroke="#0D1117" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="37" x2="44" y2="40" stroke="#0D1117" stroke-width="2" stroke-linecap="round"/>
    <text x="74" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#39D353">4+ YEARS</text>
    <text x="74" y="53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#C9D1D9">Building shipped products</text>
  </g>

  <!-- ===== pill 2: remote ===== -->
  <g transform="translate(417,10)">
    <rect width="366" height="74" rx="37" fill="url(#tintBlue)" stroke="#1F6FEB" stroke-width="1.5"/>
    <circle cx="38" cy="37" r="21" fill="#58A6FF"/>
    <path d="M28,42 a14,14 0 0 1 20,0" stroke="#0D1117" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M32,37 a9,9 0 0 1 12,0" stroke="#0D1117" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="38" cy="42" r="2" fill="#0D1117"/>
    <text x="74" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#58A6FF">REMOTE READY</text>
    <text x="74" y="53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#C9D1D9">Open to remote work</text>
  </g>

  <!-- ===== pill 3: independent ===== -->
  <g transform="translate(804,10)">
    <rect width="366" height="74" rx="37" fill="url(#tintPurple)" stroke="#8957E5" stroke-width="1.5"/>
    <circle cx="38" cy="37" r="21" fill="#A855F7"/>
    <circle cx="38" cy="30" r="5" fill="#0D1117"/>
    <path d="M28,48 a10,9 0 0 1 20,0 z" fill="#0D1117"/>
    <text x="74" y="32" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#A855F7">INDEPENDENT</text>
    <text x="74" y="53" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#C9D1D9">Freelance developer</text>
  </g>
</svg>
